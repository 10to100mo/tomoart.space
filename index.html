body {
  background: #ffffff;
  color: #111;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 200;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  text-align: center;
}

.logo {
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 100;
  font-size: clamp(3rem, 10vw, 7rem);
  letter-spacing: 0.35em;
  line-height: 1;
  animation: fadeUp 1s ease both;
  margin-bottom: 6vh;
  text-align: center;
  width: 100%;
}

.coming-soon {
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 200;
  font-size: clamp(0.7rem, 2vw, 1rem);
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: #aaa;
  animation: fadeUp 1s 0.2s ease both;
  margin-bottom: 8vh;
  text-align: center;
  width: 100%;
}

.signup-wrap {
  width: 100%;
  max-width: 420px;
  animation: fadeUp 1s 0.4s ease both;
  margin-bottom: 8vh;
  margin-left: auto;
  margin-right: auto;
}

.signup {
  display: flex;
  gap: 0;
  width: 100%;
}

.signup input {
  flex: 1;
  padding: 14px 20px;
  border: 1px solid #ddd;
  border-right: none;
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 200;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  outline: none;
  background: white;
  color: #111;
  transition: border-color 0.2s;
}

.signup input:focus { border-color: #111; }
.signup input::placeholder { color: #bbb; }

.signup button {
  padding: 14px 24px;
  background: #111;
  color: white;
  border: 1px solid #111;
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 200;
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.signup button:hover { background: white; color: #111; }

.signup-note {
  font-size: 0.65rem;
  color: #bbb;
  letter-spacing: 0.08em;
  margin-top: 10px;
  text-align: center;
}

.success-msg {
  display: none;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  color: #111;
  margin-top: 12px;
  text-align: center;
}

.sns {
  display: flex;
  gap: 24px;
  animation: fadeUp 1s 0.6s ease both;
  justify-content: center;
}

.sns-btn {
  width: 48px;
  height: 48px;
  border: 1px solid #ddd;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #111;
  transition: all 0.2s;
}

.sns-btn:hover { border-color: #111; background: #111; color: white; }

.sns-btn svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tiktok-icon {
  width: 18px !important;
  height: 18px !important;
  fill: currentColor !important;
  stroke: none !important;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

<body>

  <div class="logo">TOMO</div>
  <div class="coming-soon">Coming Soon</div>

  <div class="signup-wrap">
    <div class="signup">
      <input type="email" id="emailInput" placeholder="your@email.com">
      <button onclick="handleSignup()">NOTIFY ME</button>
    </div>
    <div class="signup-note">新作・展示情報をお届けします</div>
    <div class="success-msg" id="successMsg">✓ ありがとうございます！</div>
  </div>

  <div class="sns">
    <a href="https://www.instagram.com/tomoart.space" target="_blank" class="sns-btn" aria-label="Instagram">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <a href="https://youtube.com/@tomoartspace" target="_blank" class="sns-btn" aria-label="YouTube">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="4" ry="4"/>
        <polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <a href="https://www.tiktok.com/@tomoart.space" target="_blank" class="sns-btn" aria-label="TikTok">
      <svg viewBox="0 0 24 24" class="tiktok-icon">
        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/>
      </svg>
    </a>
  </div>

  <script>
    function handleSignup() {
      const email = document.getElementById('emailInput').value;
      if (!email || !email.includes('@')) {
        document.getElementById('emailInput').style.borderColor = '#ff4444';
        return;
      }
      document.getElementById('emailInput').style.borderColor = '#ddd';
      document.querySelector('.signup').style.display = 'none';
      document.querySelector('.signup-note').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    }
  </script>

</body>
</html>
