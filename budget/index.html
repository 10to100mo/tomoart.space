<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>家計簿 | TOMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100;0,200;0,300;0,400;1,100;1,200;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 300;
      background: #fff;
      color: #111;
      font-size: 13px;
      letter-spacing: 0.06em;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    input, select { font-family: inherit; }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 100;
      padding: 28px 32px 0;
      border-bottom: 1px solid #eee;
    }
    .topbar-row {
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .home-link { font-size: 13px; letter-spacing: 0.15em; color: #999; transition: color 0.15s; }
    .home-link:hover { color: #111; }
    .app-title { font-size: 24px; font-weight: 300; letter-spacing: 0.1em; }
    .tabs { display: flex; gap: 4px; }
    .tab-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 10px 16px; font-size: 13px; letter-spacing: 0.2em; color: #999;
      white-space: nowrap; transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: #111; }
    .tab-btn.active { color: #111; border-bottom-color: #111; }

    /* ── CONTENT ── */
    .content { max-width: 720px; padding: 32px 32px 120px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── CYCLE NAV ── */
    .cycle-nav {
      display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .cycle-arrow {
      background: none; border: 1px solid #ddd; width: 30px; height: 30px;
      font-size: 14px; color: #555; transition: all 0.15s;
    }
    .cycle-arrow:hover { border-color: #111; color: #111; }
    .cycle-label { font-size: 15px; letter-spacing: 0.05em; }
    .cycle-select {
      border: none; border-bottom: 1px solid #ccc; background: transparent;
      font-size: 12px; padding: 4px 2px; color: #777; outline: none;
    }

    .budget-total-row {
      display: flex; align-items: center; gap: 10px; margin: 20px 0 28px;
      font-size: 14px;
    }
    .budget-total-row label { color: #999; font-size: 12px; letter-spacing: 0.15em; }
    .budget-total-input {
      border: none; border-bottom: 1px solid #111; background: transparent;
      font-size: 18px; padding: 4px 2px; width: 150px; text-align: right; outline: none;
      font-variant-numeric: tabular-nums;
    }

    /* ── SUMMARY CARDS ── */
    .cards-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 36px; }
    .card { flex: 1 1 130px; border: 1px solid #eee; padding: 16px; }
    .card-label { font-size: 10px; letter-spacing: 0.15em; color: #999; margin-bottom: 8px; }
    .card-value { font-size: 18px; font-variant-numeric: tabular-nums; }
    .card-value.cash { color: #c1691f; }
    .card-value.card { color: #128a68; }
    .card-value.balance.positive { color: #1a6b3a; }
    .card-value.balance.negative { color: #c0392b; }

    /* ── ITEM ROWS ── */
    .item-group { margin-bottom: 4px; border-bottom: 1px solid #eee; }
    .item-row {
      display: flex; align-items: center; gap: 10px; padding: 12px 0;
    }
    .item-row.depth-1 { padding-left: 24px; border-top: 1px dashed #f0f0f0; }
    .item-row.group-header { flex-wrap: wrap; }
    .item-name {
      flex: 1 1 auto; font-size: 14px; cursor: text; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .item-row.group-header .item-name {
      flex: 1 1 100%; font-size: 15px; font-weight: 400; letter-spacing: 0.12em;
      white-space: normal; margin-bottom: 4px;
    }
    .item-row.depth-1 .item-name { font-size: 13px; color: #444; }
    .item-name-input {
      flex: 1 1 auto; border: none; border-bottom: 1px solid #111; background: transparent;
      font-size: 14px; font-family: inherit; outline: none; min-width: 0;
    }

    .amount-chip {
      flex: 0 0 auto; background: none; border: none; border-bottom: 1px solid #ccc;
      font-size: 15px; padding: 4px 2px; color: #111; font-variant-numeric: tabular-nums;
      min-width: 90px; text-align: right; transition: border-color 0.15s, color 0.15s;
    }
    .amount-chip.empty { color: #ccc; font-size: 13px; }
    .amount-chip.none { border-color: #111; color: #111; }
    .amount-chip.cash { border-color: #e0812c; color: #c1691f; }
    .amount-chip.card { border-color: #23b489; color: #128a68; }

    .amount-input {
      flex: 0 0 auto; width: 100px; border: none; border-bottom: 1px solid #111;
      background: transparent; font-size: 15px; padding: 4px 2px; text-align: right;
      outline: none; font-family: inherit; font-variant-numeric: tabular-nums;
    }

    .row-btn {
      flex: 0 0 auto; background: none; border: none; color: #ccc; font-size: 15px;
      line-height: 1; padding: 4px 6px; transition: color 0.15s;
    }
    .row-btn:hover { color: #c0392b; }

    .group-subtotal {
      padding: 6px 0 6px 24px; font-size: 11px; color: #aaa; letter-spacing: 0.1em;
    }

    .add-child-row { padding: 8px 0 8px 24px; }
    .add-row-btn {
      background: none; border: none; font-size: 12px; letter-spacing: 0.1em;
      color: #999; padding: 4px 0; transition: color 0.15s;
    }
    .add-row-btn:hover { color: #111; }

    .add-top-row { margin-top: 20px; }

    .grand-total-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 20px 0; margin-top: 12px; border-top: 1px solid #111;
      font-size: 15px;
    }
    .grand-total-row .value { font-variant-numeric: tabular-nums; font-size: 18px; }

    .legend {
      display: flex; gap: 20px; font-size: 11px; color: #777; margin: 24px 0 8px; flex-wrap: wrap;
    }
    .legend-swatch {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
    }

    /* ── SETTINGS ── */
    .settings-block { margin-bottom: 44px; }
    .sub-heading { font-size: 12px; letter-spacing: 0.2em; color: #aaa; margin-bottom: 16px; }
    .field-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .field-row label { font-size: 12px; color: #777; flex: 0 0 140px; }
    .field-row input { border: none; border-bottom: 1px solid #111; background: transparent; padding: 6px 2px; font-size: 14px; outline: none; width: 140px; text-align: right; }
    .ghost-btn {
      background: none; border: 1px solid #ccc; padding: 10px 20px; font-size: 12px;
      letter-spacing: 0.15em; color: #555; transition: all 0.15s;
    }
    .ghost-btn:hover { border-color: #111; color: #111; }
    .danger-zone { border: 1px solid #f0d5d0; padding: 20px; }
    .danger-zone p { font-size: 12px; color: #777; margin-bottom: 14px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #111; color: #fff; padding: 12px 24px; font-size: 13px; letter-spacing: 0.1em;
      opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .topbar { padding: 20px 18px 0; }
      .content { padding: 24px 18px 100px; }
      .app-title { font-size: 20px; }
      .amount-chip, .amount-input { min-width: 74px; width: 80px; font-size: 13px; }
      .item-name { font-size: 13px; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <a class="home-link" href="/">← TOMO</a>
    <h1 class="app-title">家計簿</h1>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="sheet">シート</button>
    <button class="tab-btn" data-tab="settings">設定</button>
  </nav>
</header>

<main class="content">

  <!-- SHEET -->
  <section id="tab-sheet" class="tab-panel active">
    <div class="cycle-nav">
      <button type="button" class="cycle-arrow" id="cycle-prev">←</button>
      <span class="cycle-label" id="cycle-label"></span>
      <button type="button" class="cycle-arrow" id="cycle-next">→</button>
      <select class="cycle-select" id="cycle-select"></select>
    </div>

    <div class="budget-total-row">
      <label for="total-budget-input">全体予算</label>
      <input type="number" id="total-budget-input" class="budget-total-input" step="1000" />
    </div>

    <div class="cards-row">
      <div class="card">
        <div class="card-label">現金 合計</div>
        <div class="card-value cash" id="sum-cash">¥0</div>
      </div>
      <div class="card">
        <div class="card-label">カード 合計</div>
        <div class="card-value card" id="sum-card">¥0</div>
      </div>
      <div class="card">
        <div class="card-label">残り</div>
        <div class="card-value balance" id="sum-balance">¥0</div>
      </div>
    </div>

    <div class="legend">
      <span><span class="legend-swatch" style="background:#111;"></span>未選択</span>
      <span><span class="legend-swatch" style="background:#e0812c;"></span>現金</span>
      <span><span class="legend-swatch" style="background:#23b489;"></span>カード</span>
    </div>

    <div id="item-list"></div>

    <div class="add-top-row">
      <button type="button" class="add-row-btn" id="add-top-item-btn">＋ 項目を追加</button>
    </div>

    <div class="grand-total-row">
      <span>支出 合計</span>
      <span class="value" id="grand-total">¥0</span>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="tab-settings" class="tab-panel">
    <h2 class="sub-heading" style="margin-top:0;">新しい月の初期値</h2>
    <div class="settings-block">
      <div class="field-row">
        <label>デフォルトの全体予算</label>
        <input type="number" id="default-budget-input" step="1000" />
      </div>
      <p style="font-size:12px; color:#777;">新しい月(サイクル)を開いたときに使われる初期値です。今表示中の月には影響しません。</p>
    </div>

    <div class="settings-block">
      <p class="sub-heading">バックアップ</p>
      <p style="font-size:12px; color:#777; margin-bottom: 14px;">
        データはこの端末のブラウザ内だけに保存されています。他の端末へ移したり、ブラウザのデータ消去に備えたりする場合は、下記でバックアップ(書き出し)・復元(読み込み)ができます。
      </p>
      <div style="display:flex; gap:12px; flex-wrap: wrap;">
        <button type="button" class="ghost-btn" id="export-btn">データを書き出す(JSON)</button>
        <button type="button" class="ghost-btn" id="import-btn">データを読み込む(JSON)</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;" />
      </div>
    </div>

    <div class="settings-block">
      <p class="sub-heading">データの削除</p>
      <div class="danger-zone">
        <p>すべての記録・項目・予算設定を削除します。この操作は取り消せません。</p>
        <button type="button" class="ghost-btn" id="reset-btn" style="border-color:#c0392b; color:#c0392b;">すべてのデータを削除</button>
      </div>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
/* ── STORAGE ── */
const STORAGE_KEY = 'tomo-budget-sheet-v1';

function defaultTemplate() {
  return [
    { id: uid(), name: '家賃', defaultAmount: 250500 },
    { id: uid(), name: '讓一振込', defaultAmount: 150000 },
    { id: uid(), name: '食費', defaultAmount: null },
    { id: uid(), name: '雑費', defaultAmount: null },
    { id: uid(), name: '水道光熱費', defaultAmount: null },
    { id: uid(), name: '通信費', defaultAmount: null },
    { id: uid(), name: 'サブスク', defaultAmount: null, children: [
      { id: uid(), name: 'YouTubeファミリー', defaultAmount: 2280 },
      { id: uid(), name: 'Netflix', defaultAmount: 2290 },
      { id: uid(), name: 'Amazonプライム', defaultAmount: null },
      { id: uid(), name: 'Apple MUSIC', defaultAmount: 1680 },
      { id: uid(), name: 'AppleCare', defaultAmount: 900 },
      { id: uid(), name: 'AppleCare', defaultAmount: 1350 },
      { id: uid(), name: '礼のiPad', defaultAmount: 650 },
      { id: uid(), name: 'Apple iCloud', defaultAmount: 1500 },
      { id: uid(), name: 'Claude', defaultAmount: 3000 }
    ]},
    { id: uid(), name: '【 REI 】', defaultAmount: 20000, children: [
      { id: uid(), name: '小遣い', defaultAmount: null },
      { id: uid(), name: '美容院', defaultAmount: null },
      { id: uid(), name: '病院', defaultAmount: null },
      { id: uid(), name: '交通費', defaultAmount: null }
    ]},
    { id: uid(), name: '【 TOMO 】', defaultAmount: null, children: [
      { id: uid(), name: '美容代', defaultAmount: null },
      { id: uid(), name: '病院', defaultAmount: null },
      { id: uid(), name: '整体', defaultAmount: null },
      { id: uid(), name: '交通費', defaultAmount: null }
    ]},
    { id: uid(), name: 'Suica', defaultAmount: null },
    { id: uid(), name: '分割払い残高', defaultAmount: null, children: [
      { id: uid(), name: 'MI Card', defaultAmount: null },
      { id: uid(), name: 'JCB', defaultAmount: null }
    ]},
    { id: uid(), name: 'Amazon定期便', defaultAmount: null }
  ];
}

function defaultData() {
  return {
    template: defaultTemplate(),
    totalBudgetDefault: 700000,
    cycles: {}
  };
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function sanitizeTemplateItem(raw) {
  const item = { id: raw.id || uid(), name: raw.name || '', defaultAmount: (typeof raw.defaultAmount === 'number') ? raw.defaultAmount : null };
  if (Array.isArray(raw.children)) item.children = raw.children.map(sanitizeTemplateItem);
  return item;
}

function sanitizeCycleItem(raw) {
  const item = {
    id: raw.id || uid(),
    name: raw.name || '',
    amount: (typeof raw.amount === 'number') ? raw.amount : null,
    payment: ['cash', 'card'].includes(raw.payment) ? raw.payment : 'none'
  };
  if (Array.isArray(raw.children)) item.children = raw.children.map(sanitizeCycleItem);
  return item;
}

let data = loadData();

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const d = defaultData();
    const template = Array.isArray(parsed.template) && parsed.template.length
      ? parsed.template.map(sanitizeTemplateItem) : d.template;
    const totalBudgetDefault = (typeof parsed.totalBudgetDefault === 'number') ? parsed.totalBudgetDefault : d.totalBudgetDefault;
    const cycles = {};
    if (parsed.cycles && typeof parsed.cycles === 'object') {
      Object.keys(parsed.cycles).forEach(key => {
        const c = parsed.cycles[key];
        cycles[key] = {
          totalBudget: (typeof c.totalBudget === 'number') ? c.totalBudget : totalBudgetDefault,
          items: Array.isArray(c.items) ? c.items.map(sanitizeCycleItem) : []
        };
      });
    }
    return { template, totalBudgetDefault, cycles };
  } catch (e) {
    console.error('データの読み込みに失敗しました', e);
    return defaultData();
  }
}

function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function formatCurrency(n) {
  if (n === null || n === undefined) return '';
  return '¥' + Math.round(n).toLocaleString('ja-JP');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── CYCLE (16日始まり、翌月15日締め) ── */
function pad2(n) { return String(n).padStart(2, '0'); }

function cycleKeyForDate(d) {
  let y = d.getFullYear(), m = d.getMonth() + 1;
  if (d.getDate() < 16) {
    m -= 1;
    if (m === 0) { m = 12; y -= 1; }
  }
  return `${y}-${pad2(m)}`;
}

function shiftCycleKey(key, delta) {
  let [y, m] = key.split('-').map(Number);
  m += delta;
  while (m > 12) { m -= 12; y += 1; }
  while (m < 1) { m += 12; y -= 1; }
  return `${y}-${pad2(m)}`;
}

function cycleLabel(key) {
  let [y, m] = key.split('-').map(Number);
  let ey = y, em = m + 1;
  if (em > 12) { em = 1; ey += 1; }
  if (ey === y) return `${y}年${m}月16日 〜 ${em}月15日`;
  return `${y}年${m}月16日 〜 ${ey}年${em}月15日`;
}

let currentCycle = cycleKeyForDate(new Date());

function cloneTemplateToCycleItems(template) {
  return template.map(t => {
    const item = { id: uid(), name: t.name, amount: t.defaultAmount, payment: 'none' };
    if (Array.isArray(t.children)) item.children = cloneTemplateToCycleItems(t.children);
    return item;
  });
}

function ensureCycle(key) {
  if (!data.cycles[key]) {
    data.cycles[key] = {
      totalBudget: data.totalBudgetDefault,
      items: cloneTemplateToCycleItems(data.template)
    };
    saveData();
  }
  return data.cycles[key];
}

/* ── TOTALS ── */
function walkRows(items, fn, parent) {
  items.forEach(row => {
    fn(row, parent);
    if (Array.isArray(row.children)) walkRows(row.children, fn, row);
  });
}

function sumBy(items, predicate) {
  let total = 0;
  walkRows(items, row => {
    if (typeof row.amount === 'number' && predicate(row)) total += row.amount;
  });
  return total;
}

function groupTotal(row) {
  let total = (typeof row.amount === 'number') ? row.amount : 0;
  if (Array.isArray(row.children)) {
    row.children.forEach(c => { total += groupTotal(c); });
  }
  return total;
}

/* ── TABS ── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'settings') renderSettings();
  });
});

/* ── CYCLE NAV BINDINGS ── */
document.getElementById('cycle-prev').addEventListener('click', () => {
  currentCycle = shiftCycleKey(currentCycle, -1);
  renderSheet();
});
document.getElementById('cycle-next').addEventListener('click', () => {
  currentCycle = shiftCycleKey(currentCycle, 1);
  renderSheet();
});
document.getElementById('cycle-select').addEventListener('change', (e) => {
  currentCycle = e.target.value;
  renderSheet();
});
document.getElementById('total-budget-input').addEventListener('change', (e) => {
  const val = parseFloat(e.target.value);
  const cycle = ensureCycle(currentCycle);
  cycle.totalBudget = (val > 0) ? val : 0;
  saveData();
  renderSummary();
});

/* ── ADD TOP-LEVEL ITEM ── */
document.getElementById('add-top-item-btn').addEventListener('click', () => {
  const name = prompt('新しい項目名を入力してください');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  data.template.push({ id: uid(), name: trimmed, defaultAmount: null });
  const cycle = ensureCycle(currentCycle);
  cycle.items.push({ id: uid(), name: trimmed, amount: null, payment: 'none' });
  saveData();
  renderSheet();
  showToast('項目を追加しました');
});

/* ── RENDER: CYCLE SELECT ── */
function renderCycleSelect() {
  const select = document.getElementById('cycle-select');
  const keys = new Set(Object.keys(data.cycles));
  keys.add(currentCycle);
  const sorted = [...keys].sort().reverse();
  select.innerHTML = '';
  sorted.forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = cycleLabel(k);
    if (k === currentCycle) opt.selected = true;
    select.appendChild(opt);
  });
}

/* ── RENDER: ITEM LIST ── */
function renderItemList() {
  const cycle = ensureCycle(currentCycle);
  const list = document.getElementById('item-list');
  list.innerHTML = '';

  cycle.items.forEach(item => {
    const group = document.createElement('div');
    group.className = 'item-group';
    group.appendChild(buildItemRow(item, 0, cycle.items));

    if (Array.isArray(item.children)) {
      item.children.forEach(child => {
        group.appendChild(buildItemRow(child, 1, item.children));
      });
    }

    if (Array.isArray(item.children) && item.children.length) {
      const subtotal = document.createElement('div');
      subtotal.className = 'group-subtotal';
      subtotal.textContent = '小計 ' + formatCurrency(groupTotal(item));
      group.appendChild(subtotal);
    }

    const addChildRow = document.createElement('div');
    addChildRow.className = 'add-child-row';
    const addChildBtn = document.createElement('button');
    addChildBtn.type = 'button';
    addChildBtn.className = 'add-row-btn';
    addChildBtn.textContent = '＋ 小項目を追加';
    addChildBtn.addEventListener('click', () => {
      const name = prompt('新しい小項目名を入力してください');
      if (!name || !name.trim()) return;
      const trimmed = name.trim();
      if (!Array.isArray(item.children)) item.children = [];
      item.children.push({ id: uid(), name: trimmed, amount: null, payment: 'none' });

      const tmplItem = data.template.find(t => t.id === item.id);
      if (tmplItem) {
        if (!Array.isArray(tmplItem.children)) tmplItem.children = [];
        tmplItem.children.push({ id: uid(), name: trimmed, defaultAmount: null });
      }
      saveData();
      renderSheet();
    });
    addChildRow.appendChild(addChildBtn);
    group.appendChild(addChildRow);

    list.appendChild(group);
  });
}

function buildItemRow(row, depth, siblingArray) {
  const el = document.createElement('div');
  const isGroupHeader = depth === 0 && Array.isArray(row.children) && row.children.length > 0;
  el.className = 'item-row' + (depth > 0 ? ' depth-1' : '') + (isGroupHeader ? ' group-header' : '');

  const nameEl = document.createElement('span');
  nameEl.className = 'item-name';
  nameEl.textContent = row.name;
  nameEl.title = 'ダブルクリックで名前を編集';
  nameEl.addEventListener('dblclick', () => startRenameRow(el, row, depth));
  el.appendChild(nameEl);

  const amountBtn = document.createElement('button');
  amountBtn.type = 'button';
  amountBtn.className = 'amount-chip ' + row.payment + (row.amount === null ? ' empty' : '');
  amountBtn.textContent = row.amount === null ? '未入力' : formatCurrency(row.amount);
  amountBtn.title = 'クリックで 未選択→現金→カード を切り替え';
  amountBtn.addEventListener('click', () => {
    const order = ['none', 'cash', 'card'];
    row.payment = order[(order.indexOf(row.payment) + 1) % order.length];
    saveData();
    renderSheet();
  });
  amountBtn.addEventListener('dblclick', () => startEditAmount(el, row));
  el.appendChild(amountBtn);

  const editBtn = document.createElement('button');
  editBtn.type = 'button';
  editBtn.className = 'row-btn';
  editBtn.textContent = '✎';
  editBtn.style.color = '#bbb';
  editBtn.title = '金額を編集';
  editBtn.addEventListener('click', () => startEditAmount(el, row));
  el.appendChild(editBtn);

  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'row-btn';
  delBtn.textContent = '×';
  delBtn.title = '削除';
  delBtn.addEventListener('click', () => {
    if (!confirm(`「${row.name}」を削除しますか?`)) return;
    const idx = siblingArray.findIndex(r => r.id === row.id);
    if (idx >= 0) siblingArray.splice(idx, 1);
    if (depth === 0) {
      const ti = data.template.findIndex(t => t.id === row.id);
      if (ti >= 0) data.template.splice(ti, 1);
    } else {
      data.template.forEach(t => {
        if (Array.isArray(t.children)) {
          const ci = t.children.findIndex(c => c.id === row.id);
          if (ci >= 0) t.children.splice(ci, 1);
        }
      });
    }
    saveData();
    renderSheet();
    showToast('削除しました');
  });
  el.appendChild(delBtn);

  return el;
}

function startRenameRow(rowEl, row, depth) {
  const nameEl = rowEl.querySelector('.item-name');
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'item-name-input';
  input.value = row.name;
  nameEl.replaceWith(input);
  input.focus();
  input.select();

  const commit = () => {
    const val = input.value.trim();
    if (val) {
      row.name = val;
      if (depth === 0) {
        const t = data.template.find(x => x.id === row.id);
        if (t) t.name = val;
      } else {
        data.template.forEach(t => {
          if (Array.isArray(t.children)) {
            const c = t.children.find(x => x.id === row.id);
            if (c) c.name = val;
          }
        });
      }
      saveData();
    }
    renderSheet();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); renderSheet(); }
  });
}

function startEditAmount(rowEl, row) {
  const chip = rowEl.querySelector('.amount-chip');
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'amount-input';
  input.step = '1';
  input.value = row.amount === null ? '' : row.amount;
  input.placeholder = '0';
  chip.replaceWith(input);
  input.focus();
  input.select();

  const commit = () => {
    const val = parseFloat(input.value);
    row.amount = (input.value.trim() === '' || isNaN(val)) ? null : val;
    saveData();
    renderSheet();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); renderSheet(); }
  });
}

/* ── RENDER: SUMMARY ── */
function renderSummary() {
  const cycle = ensureCycle(currentCycle);
  const cash = sumBy(cycle.items, r => r.payment === 'cash');
  const card = sumBy(cycle.items, r => r.payment === 'card');
  const grand = sumBy(cycle.items, () => true);
  const balance = (cycle.totalBudget || 0) - grand;

  document.getElementById('sum-cash').textContent = formatCurrency(cash);
  document.getElementById('sum-card').textContent = formatCurrency(card);
  const balanceEl = document.getElementById('sum-balance');
  balanceEl.textContent = formatCurrency(balance);
  balanceEl.className = 'card-value balance ' + (balance >= 0 ? 'positive' : 'negative');

  document.getElementById('grand-total').textContent = formatCurrency(grand);
  document.getElementById('total-budget-input').value = cycle.totalBudget || '';
}

/* ── RENDER: SHEET (all) ── */
function renderSheet() {
  ensureCycle(currentCycle);
  document.getElementById('cycle-label').textContent = cycleLabel(currentCycle);
  renderCycleSelect();
  renderItemList();
  renderSummary();
}

/* ── SETTINGS ── */
function renderSettings() {
  document.getElementById('default-budget-input').value = data.totalBudgetDefault || '';
}

document.getElementById('default-budget-input').addEventListener('change', (e) => {
  const val = parseFloat(e.target.value);
  data.totalBudgetDefault = (val > 0) ? val : 0;
  saveData();
  showToast('保存しました');
});

document.getElementById('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  a.href = url;
  a.download = `kakeibo-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('書き出しました');
});

document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed.template) || typeof parsed.cycles !== 'object') throw new Error('invalid format');
      if (!confirm('現在のデータを読み込んだ内容で上書きします。よろしいですか?')) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      data = loadData();
      currentCycle = cycleKeyForDate(new Date());
      showToast('読み込みました');
      renderSheet();
      renderSettings();
    } catch (err) {
      showToast('ファイルの形式が正しくありません');
    } finally {
      e.target.value = '';
    }
  };
  reader.readAsText(file);
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('本当にすべてのデータを削除しますか?この操作は取り消せません。')) return;
  if (!confirm('もう一度確認します。全項目・記録・予算を削除してよろしいですか?')) return;
  data = defaultData();
  saveData();
  currentCycle = cycleKeyForDate(new Date());
  showToast('データを削除しました');
  renderSheet();
  renderSettings();
});

/* ── INIT ── */
renderSheet();
</script>
</body>
