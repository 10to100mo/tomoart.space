<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FLOW | TOMO</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FLOW" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#111111" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100;0,200;0,300;0,400;1,100;1,200;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 300;
      background: #111;
      color: #fff;
      font-size: 16px;
      letter-spacing: 0.06em;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    input, select { font-family: inherit; }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky;
      top: 0;
      background: #111;
      z-index: 100;
      padding: 28px 32px 0;
      border-bottom: 1px solid #262626;
    }
    .topbar-row {
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .home-link { font-size: 15px; letter-spacing: 0.15em; color: #999; transition: color 0.15s; }
    .home-link:hover { color: #fff; }
    .app-title { font-size: 28px; font-weight: 300; letter-spacing: 0.1em; }
    .tabs { display: flex; gap: 4px; }
    .tab-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 10px 16px; font-size: 15px; letter-spacing: 0.2em; color: #999;
      white-space: nowrap; transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active { color: #fff; border-bottom-color: #fff; }

    /* ── CONTENT ── */
    .content { max-width: 720px; padding: 32px 32px 120px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── CYCLE NAV ── */
    .cycle-nav {
      display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .cycle-arrow {
      background: none; border: 1px solid #333; width: 34px; height: 34px;
      font-size: 16px; color: #999; transition: all 0.15s;
    }
    .cycle-arrow:hover { border-color: #fff; color: #fff; }
    .cycle-label { font-size: 18px; letter-spacing: 0.05em; }
    .cycle-select {
      border: none; border-bottom: 1px solid #3a3a3a; background: transparent;
      font-size: 14px; padding: 4px 2px; color: #777; outline: none;
    }

    .budget-total-row {
      display: flex; align-items: center; gap: 10px; margin: 10px 0 16px;
      font-size: 16px;
    }
    .budget-total-row label { color: #999; font-size: 14px; letter-spacing: 0.15em; }
    .budget-total-input {
      border: none; border-bottom: none; background: transparent;
      color: #fff; font-size: 22px; padding: 4px 2px; width: 150px; text-align: right; outline: none;
      font-variant-numeric: tabular-nums;
    }

    /* ── SUMMARY CARDS ── */
    .cards-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .card { flex: 1 1 130px; border: 1px solid #262626; padding: 10px 12px; }
    .card-label { font-size: 12px; letter-spacing: 0.15em; color: #999; margin-bottom: 4px; }
    .card-value { font-size: 22px; font-variant-numeric: tabular-nums; }
    .card-value.cash { color: #ff00ff; }
    .card-value.card { color: #00ff7f; }
    .card-value.balance.positive { color: #fff; }
    .card-value.balance.negative { color: #fff; }

    /* ── ITEM ROWS ── */
    .item-group { margin-bottom: 0; border-bottom: 1px solid #262626; }
    .item-row {
      display: flex; align-items: center; gap: 8px; padding: 4px 0;
    }
    .item-row.depth-1 { padding-left: 24px; }
    .item-row.group-header { flex-wrap: wrap; }
    .item-name {
      flex: 1 1 auto; font-size: 17px; cursor: text; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .item-row:not(.depth-1) .item-name {
      font-size: 18px; font-weight: 400; letter-spacing: 0.12em;
    }
    .item-row.group-header .item-name {
      flex: 1 1 100%; white-space: normal; margin-bottom: 2px;
    }
    .item-row.depth-1 .item-name { font-size: 16px; color: #aaa; }
    .item-name-input {
      flex: 1 1 auto; border: none; border-bottom: none; background: transparent;
      color: #fff; font-size: 17px; font-family: inherit; outline: none; min-width: 0;
    }
    .entry-fields { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .item-date {
      flex: 0 0 auto; font-size: 13px; color: #999; letter-spacing: 0.02em;
      min-width: 38px; text-align: right; white-space: nowrap;
    }
    .item-date.empty { color: #444; }
    .item-place {
      flex: 0 0 auto; font-size: 13px; color: #999; letter-spacing: 0.02em;
      max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .item-place.empty { color: #444; }

    .amount-chip {
      flex: 0 0 auto; background: none; border: none;
      font-size: 18px; padding: 2px 2px; color: #fff; font-variant-numeric: tabular-nums;
      min-width: 90px; text-align: right; transition: color 0.15s;
    }
    .amount-chip.empty { color: #bbb; font-size: 17px; }
    .amount-chip.none { color: #fff; }
    .amount-chip.cash { color: #ff00ff; }
    .amount-chip.card { color: #00ff7f; }

    .edit-form { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .edit-form input {
      border: none; border-bottom: none; background: transparent;
      color: #fff; font-size: 14px; padding: 2px; outline: none; font-family: inherit;
    }
    .edit-form .edit-date { width: 64px; }
    .edit-form .edit-place { width: 90px; }
    .edit-form .edit-amount { width: 90px; text-align: right; font-variant-numeric: tabular-nums; }
    .edit-confirm {
      background: none; border: none; color: #fff; font-size: 16px; padding: 2px 6px;
    }

    .row-btn {
      flex: 0 0 auto; background: none; border: none; color: #666; font-size: 17px;
      line-height: 1; padding: 2px 6px; transition: color 0.15s;
    }
    .row-btn:hover { color: #f87171; }

    /* ── SWIPE TO DELETE ── */
    .item-row-wrap { position: relative; overflow: hidden; }
    .swipe-delete-btn {
      position: absolute; top: 50%; right: 14px; transform: translateY(-50%);
      width: 44px; height: 76%; max-height: 44px; border-radius: 12px;
      background: #f96058; color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
    }
    .swipe-delete-btn svg { width: 22px; height: 22px; }
    .item-row {
      background: #111; position: relative; z-index: 1; touch-action: pan-y;
      user-select: none; -webkit-user-select: none;
    }

    .reorder-group { flex: 0 0 auto; display: flex; flex-direction: column; }
    .reorder-btn {
      background: none; border: none; color: #666; font-size: 10px; line-height: 1;
      padding: 1px 4px; transition: color 0.15s;
    }
    .reorder-btn:hover:not(:disabled) { color: #fff; }
    .reorder-btn:disabled { color: #262626; cursor: default; }

    .group-subtotal {
      padding: 0 0 4px 24px; font-size: 13px; color: #aaa; letter-spacing: 0.1em;
    }

    .add-child-row { padding: 0 0 4px 24px; }
    .add-row-btn {
      background: none; border: none; font-size: 14px; letter-spacing: 0.1em;
      color: #999; padding: 2px 0; transition: color 0.15s;
    }
    .add-row-btn:hover { color: #fff; }

    .add-top-row { margin-top: 10px; }

    .grand-total-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 10px 0; margin-top: 6px; border-top: 1px solid #fff;
      font-size: 18px;
    }
    .grand-total-row .value { font-variant-numeric: tabular-nums; font-size: 22px; }

    .legend {
      display: flex; gap: 20px; font-size: 13px; color: #777; margin: 12px 0 6px; flex-wrap: wrap;
    }
    .legend-swatch {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
    }

    /* ── SETTINGS ── */
    .settings-block { margin-bottom: 44px; }
    .sub-heading { font-size: 14px; letter-spacing: 0.2em; color: #aaa; margin-bottom: 16px; }
    .field-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .field-row label { font-size: 14px; color: #777; flex: 0 0 140px; }
    .field-row input { border: none; border-bottom: none; background: transparent; color: #fff; padding: 6px 2px; font-size: 16px; outline: none; width: 140px; text-align: right; }
    .ghost-btn {
      background: none; border: 1px solid #3a3a3a; padding: 10px 20px; font-size: 14px;
      letter-spacing: 0.15em; color: #999; transition: all 0.15s;
    }
    .ghost-btn:hover { border-color: #fff; color: #fff; }
    .danger-zone { border: 1px solid #4a2a28; padding: 20px; }
    .danger-zone p { font-size: 14px; color: #777; margin-bottom: 14px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #fff; color: #111; padding: 12px 24px; font-size: 15px; letter-spacing: 0.1em;
      opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .topbar { padding: 20px 18px 0; }
      .content { padding: 24px 18px 100px; }
      .app-title { font-size: 24px; }
      .amount-chip { min-width: 74px; width: 80px; font-size: 16px; }
      .item-name { font-size: 16px; }
      .item-date { min-width: 30px; }
      .item-place { max-width: 46px; }
      .edit-form .edit-date { width: 56px; }
      .edit-form .edit-place { width: 70px; }
      .edit-form .edit-amount { width: 70px; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <a class="home-link" href="/">← TOMO</a>
    <h1 class="app-title">FLOW</h1>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="sheet">シート</button>
    <button class="tab-btn" data-tab="settings">設定</button>
  </nav>
</header>

<main class="content">

  <!-- SHEET -->
  <section id="tab-sheet" class="tab-panel active">
    <div class="cycle-nav">
      <button type="button" class="cycle-arrow" id="cycle-prev">←</button>
      <span class="cycle-label" id="cycle-label"></span>
      <button type="button" class="cycle-arrow" id="cycle-next">→</button>
      <select class="cycle-select" id="cycle-select"></select>
    </div>

    <div class="budget-total-row">
      <label for="total-budget-input">全体予算</label>
      <input type="number" id="total-budget-input" class="budget-total-input" step="1000" />
    </div>

    <div class="cards-row">
      <div class="card">
        <div class="card-label">現金 合計</div>
        <div class="card-value cash" id="sum-cash">¥0</div>
      </div>
      <div class="card">
        <div class="card-label">カード 合計</div>
        <div class="card-value card" id="sum-card">¥0</div>
      </div>
      <div class="card">
        <div class="card-label">残り</div>
        <div class="card-value balance" id="sum-balance">¥0</div>
      </div>
    </div>

    <div class="legend">
      <span><span class="legend-swatch" style="background:#111;"></span>未選択</span>
      <span><span class="legend-swatch" style="background:#ff00ff;"></span>現金</span>
      <span><span class="legend-swatch" style="background:#00ff7f;"></span>カード</span>
    </div>

    <div id="item-list"></div>

    <div class="add-top-row">
      <button type="button" class="add-row-btn" id="add-top-item-btn">＋ 項目を追加</button>
    </div>

    <div class="grand-total-row">
      <span>支出 合計</span>
      <span class="value" id="grand-total">¥0</span>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="tab-settings" class="tab-panel">
    <h2 class="sub-heading" style="margin-top:0;">新しい月の初期値</h2>
    <div class="settings-block">
      <div class="field-row">
        <label>デフォルトの全体予算</label>
        <input type="number" id="default-budget-input" step="1000" />
      </div>
      <p style="font-size:12px; color:#777;">新しい月(サイクル)を開いたときに使われる初期値です。今表示中の月には影響しません。</p>
    </div>

    <div class="settings-block">
      <p class="sub-heading">バックアップ</p>
      <p style="font-size:12px; color:#777; margin-bottom: 14px;">
        データはこの端末のブラウザ内だけに保存されています。他の端末へ移したり、ブラウザのデータ消去に備えたりする場合は、下記でバックアップ(書き出し)・復元(読み込み)ができます。
      </p>
      <div style="display:flex; gap:12px; flex-wrap: wrap;">
        <button type="button" class="ghost-btn" id="export-btn">データを書き出す(JSON)</button>
        <button type="button" class="ghost-btn" id="import-btn">データを読み込む(JSON)</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;" />
      </div>
    </div>

    <div class="settings-block">
      <p class="sub-heading">データの削除</p>
      <div class="danger-zone">
        <p>すべての記録・項目・予算設定を削除します。この操作は取り消せません。</p>
        <button type="button" class="ghost-btn" id="reset-btn" style="border-color:#f87171; color:#f87171;">すべてのデータを削除</button>
      </div>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
/* ── STORAGE ── */
const STORAGE_KEY = 'tomo-budget-sheet-v1';

function defaultTemplate() {
  return [
    { id: uid(), name: '家賃', defaultAmount: 250500, noChildAdd: true },
    { id: uid(), name: '讓一振込', defaultAmount: 150000, noChildAdd: true },
    { id: uid(), name: '食費', defaultAmount: null, noChildAdd: true, autoEntries: true, children: [] },
    { id: uid(), name: '雑費', defaultAmount: null, noChildAdd: true, autoEntries: true, children: [] },
    { id: uid(), name: '水道光熱費', defaultAmount: null },
    { id: uid(), name: '通信費', defaultAmount: null },
    { id: uid(), name: 'サブスク', defaultAmount: null, noChildAdd: true, children: [
      { id: uid(), name: 'YouTubeファミリー', defaultAmount: 2280 },
      { id: uid(), name: 'Netflix', defaultAmount: 2290 },
      { id: uid(), name: 'Amazonプライム', defaultAmount: null },
      { id: uid(), name: 'Apple MUSIC', defaultAmount: 1680 },
      { id: uid(), name: 'AppleCare', defaultAmount: 900 },
      { id: uid(), name: 'AppleCare', defaultAmount: 1350 },
      { id: uid(), name: '礼のiPad', defaultAmount: 650 },
      { id: uid(), name: 'Apple iCloud', defaultAmount: 1500 },
      { id: uid(), name: 'Claude', defaultAmount: 3000 }
    ]},
    { id: uid(), name: 'REI', defaultAmount: null, noChildAdd: true, children: [
      { id: uid(), name: '定期', defaultAmount: 20000 },
      { id: uid(), name: '小遣い', defaultAmount: null },
      { id: uid(), name: '美容院', defaultAmount: null },
      { id: uid(), name: '病院', defaultAmount: null },
      { id: uid(), name: '交通費', defaultAmount: null, repeatable: true }
    ]},
    { id: uid(), name: 'TOMO', defaultAmount: null, noChildAdd: true, children: [
      { id: uid(), name: '美容院', defaultAmount: null },
      { id: uid(), name: '美容代', defaultAmount: null },
      { id: uid(), name: '病院', defaultAmount: null },
      { id: uid(), name: '整体', defaultAmount: null },
      { id: uid(), name: '交通費', defaultAmount: null, repeatable: true }
    ]},
    { id: uid(), name: 'Suica', defaultAmount: null },
    { id: uid(), name: '分割払い残高', defaultAmount: null, noChildAdd: true, children: [
      { id: uid(), name: 'MI Card', defaultAmount: null },
      { id: uid(), name: 'JCB', defaultAmount: null }
    ]},
    { id: uid(), name: 'Amazon定期便', defaultAmount: null, noChildAdd: true, autoEntries: true, children: [] }
  ];
}

function defaultData() {
  return {
    template: defaultTemplate(),
    totalBudgetDefault: 700000,
    cycles: {},
    collapsedGroups: {}
  };
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function sanitizeTemplateItem(raw) {
  const item = { id: raw.id || uid(), name: raw.name || '', defaultAmount: (typeof raw.defaultAmount === 'number') ? raw.defaultAmount : null, noChildAdd: !!raw.noChildAdd, autoEntries: !!raw.autoEntries, repeatable: !!raw.repeatable };
  if (Array.isArray(raw.children)) item.children = raw.children.map(sanitizeTemplateItem);
  return item;
}

function sanitizeCycleItem(raw) {
  const item = {
    id: raw.id || uid(),
    name: raw.name || '',
    amount: (typeof raw.amount === 'number') ? raw.amount : null,
    payment: ['cash', 'card'].includes(raw.payment) ? raw.payment : 'none',
    date: (typeof raw.date === 'string' && raw.date) ? raw.date : null,
    place: (typeof raw.place === 'string') ? raw.place : '',
    noChildAdd: !!raw.noChildAdd,
    autoEntries: !!raw.autoEntries,
    repeatable: !!raw.repeatable
  };
  if (Array.isArray(raw.children)) item.children = raw.children.map(sanitizeCycleItem);
  return item;
}

let data = loadData();

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const d = defaultData();
    const template = Array.isArray(parsed.template) && parsed.template.length
      ? parsed.template.map(sanitizeTemplateItem) : d.template;
    const totalBudgetDefault = (typeof parsed.totalBudgetDefault === 'number') ? parsed.totalBudgetDefault : d.totalBudgetDefault;
    const cycles = {};
    if (parsed.cycles && typeof parsed.cycles === 'object') {
      Object.keys(parsed.cycles).forEach(key => {
        const c = parsed.cycles[key];
        cycles[key] = {
          totalBudget: (typeof c.totalBudget === 'number') ? c.totalBudget : totalBudgetDefault,
          items: Array.isArray(c.items) ? c.items.map(sanitizeCycleItem) : []
        };
      });
    }
    const collapsedGroups = (parsed.collapsedGroups && typeof parsed.collapsedGroups === 'object') ? parsed.collapsedGroups : {};
    return { template, totalBudgetDefault, cycles, collapsedGroups };
  } catch (e) {
    console.error('データの読み込みに失敗しました', e);
    return defaultData();
  }
}

function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function formatCurrency(n) {
  if (n === null || n === undefined) return '';
  return '¥' + Math.round(n).toLocaleString('ja-JP');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── CYCLE (16日始まり、翌月15日締め) ── */
function pad2(n) { return String(n).padStart(2, '0'); }

function cycleKeyForDate(d) {
  let y = d.getFullYear(), m = d.getMonth() + 1;
  if (d.getDate() < 16) {
    m -= 1;
    if (m === 0) { m = 12; y -= 1; }
  }
  return `${y}-${pad2(m)}`;
}

function shiftCycleKey(key, delta) {
  let [y, m] = key.split('-').map(Number);
  m += delta;
  while (m > 12) { m -= 12; y += 1; }
  while (m < 1) { m += 12; y -= 1; }
  return `${y}-${pad2(m)}`;
}

function cycleLabel(key) {
  let [y, m] = key.split('-').map(Number);
  let ey = y, em = m + 1;
  if (em > 12) { em = 1; ey += 1; }
  if (ey === y) return `${y}年${m}月16日 〜 ${em}月15日`;
  return `${y}年${m}月16日 〜 ${ey}年${em}月15日`;
}

let currentCycle = cycleKeyForDate(new Date());

function cloneTemplateToCycleItems(template) {
  return template.map(t => {
    const item = { id: t.id, name: t.name, amount: t.defaultAmount, payment: 'none', date: null, place: '', noChildAdd: !!t.noChildAdd, autoEntries: !!t.autoEntries, repeatable: !!t.repeatable };
    if (Array.isArray(t.children)) item.children = cloneTemplateToCycleItems(t.children);
    return item;
  });
}

function formatDateShort(iso) {
  const parts = iso.split('-');
  if (parts.length !== 3) return iso;
  return `${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
}

// UI-only structural flags (like noChildAdd) can change in the code after a
// cycle already exists in someone's browser. Re-apply them by name every
// time so a code update takes effect without needing a data reset.
function syncStructuralFlags(items, templateItems) {
  items.forEach(item => {
    const t = templateItems.find(x => x.name === item.name);
    if (!t) return;
    item.noChildAdd = !!t.noChildAdd;
    item.autoEntries = !!t.autoEntries;
    item.repeatable = !!t.repeatable;
    // Non-destructive: only initialize an empty children array when the
    // item doesn't already have one (a group with real children is never
    // touched here).
    if (Array.isArray(t.children) && !Array.isArray(item.children)) {
      item.children = [];
    }
    if (Array.isArray(item.children) && Array.isArray(t.children)) {
      syncStructuralFlags(item.children, t.children);
    }
  });
}

function ensureCycle(key) {
  if (!data.cycles[key]) {
    data.cycles[key] = {
      totalBudget: data.totalBudgetDefault,
      items: cloneTemplateToCycleItems(data.template)
    };
    saveData();
  } else {
    syncStructuralFlags(data.cycles[key].items, data.template);
  }
  return data.cycles[key];
}

/* ── TOTALS ── */
function walkRows(items, fn, parent) {
  items.forEach(row => {
    fn(row, parent);
    if (Array.isArray(row.children)) walkRows(row.children, fn, row);
  });
}

function sumBy(items, predicate) {
  let total = 0;
  walkRows(items, row => {
    if (typeof row.amount === 'number' && predicate(row)) total += row.amount;
  });
  return total;
}

function groupTotal(row) {
  let total = (typeof row.amount === 'number') ? row.amount : 0;
  if (Array.isArray(row.children)) {
    row.children.forEach(c => { total += groupTotal(c); });
  }
  return total;
}

/* ── CLOSE OPEN SWIPE ROWS ON OUTSIDE TAP ── */
document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.item-row-wrap')) closeOpenSwipeRows();
});

/* ── TABS ── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'settings') renderSettings();
  });
});

/* ── CYCLE NAV BINDINGS ── */
document.getElementById('cycle-prev').addEventListener('click', () => {
  currentCycle = shiftCycleKey(currentCycle, -1);
  renderSheet();
});
document.getElementById('cycle-next').addEventListener('click', () => {
  currentCycle = shiftCycleKey(currentCycle, 1);
  renderSheet();
});
document.getElementById('cycle-select').addEventListener('change', (e) => {
  currentCycle = e.target.value;
  renderSheet();
});
document.getElementById('total-budget-input').addEventListener('change', (e) => {
  const val = parseFloat(e.target.value);
  const cycle = ensureCycle(currentCycle);

/* ── ADD TOP-LEVEL ITEM ── */
document.getElementById('add-top-item-btn').addEventListener('click', () => {
  const name = prompt('新しい項目名を入力してください');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  const newId = uid();
  data.template.push({ id: newId, name: trimmed, defaultAmount: null });
  const cycle = ensureCycle(currentCycle);
  cycle.items.push({ id: newId, name: trimmed, amount: null, payment: 'none', date: null, place: '' });
  saveData();
  renderSheet();
  showToast('項目を追加しました');
});

/* ── RENDER: CYCLE SELECT ── */
function renderCycleSelect() {
  const select = document.getElementById('cycle-select');
  const keys = new Set(Object.keys(data.cycles));
  keys.add(currentCycle);
  const sorted = [...keys].sort().reverse();
  select.innerHTML = '';
  sorted.forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = cycleLabel(k);
    if (k === currentCycle) opt.selected = true;
    select.appendChild(opt);
  });
}

// For 買い物 log style categories (autoEntries): always keep exactly one
// blank child ready at the end, so finishing one purchase automatically
// opens a place for the next one. Self-healing regardless of add/delete
// order — just enforces the invariant on every render.
function ensureAutoEntrySlot(item) {
  if (!Array.isArray(item.children)) item.children = [];
  const last = item.children[item.children.length - 1];
  if (!last || last.amount !== null) {
    item.children.push({ id: uid(), name: '', amount: null, payment: 'none', date: null, place: '' });
    saveData();
  }
}

// For specific named children marked repeatable in the template (e.g.
// REI/TOMOの交通費, which can happen more than once per cycle): keep one
// blank instance of that name ready right after the last one, and
// re-seed it if every instance was deleted. Derives the list of
// repeatable names from the template (not the live children) so it
// survives a full delete.
function ensureRepeatableSlots(item) {
  if (!Array.isArray(item.children)) return;
  const tmplItem = data.template.find(t => t.id === item.id);
  if (!tmplItem || !Array.isArray(tmplItem.children)) return;
  tmplItem.children.filter(c => c.repeatable).map(c => c.name).forEach(name => {
    const entries = item.children.filter(c => c.name === name);
    const last = entries[entries.length - 1];
    if (!last || last.amount !== null) {
      const insertAfter = last ? item.children.lastIndexOf(last) : item.children.length - 1;
      item.children.splice(insertAfter + 1, 0, { id: uid(), name, amount: null, payment: 'none', date: null, place: '', repeatable: true });
      saveData();
    }
  });
}

/* ── RENDER: ITEM LIST ── */
function renderItemList() {
  const cycle = ensureCycle(currentCycle);
  const list = document.getElementById('item-list');
  list.innerHTML = '';

  cycle.items.forEach(item => {
    if (item.autoEntries) ensureAutoEntrySlot(item);
    else if (Array.isArray(item.children)) ensureRepeatableSlots(item);

    const group = document.createElement('div');
    group.className = 'item-group';
    group.appendChild(buildItemRow(item, 0, cycle.items));

    const isGroup = Array.isArray(item.children);
    const hasChildren = isGroup && item.children.length > 0;
    const collapsed = hasChildren && !!data.collapsedGroups[item.name];

    if (hasChildren && !collapsed) {
      item.children.forEach(child => {
        group.appendChild(buildItemRow(child, 1, item.children, !!item.autoEntries));
      });
    }

    if (isGroup) {
      const subtotal = document.createElement('div');
      subtotal.className = 'group-subtotal';
      subtotal.textContent = '小計 ' + formatCurrency(groupTotal(item));
      group.appendChild(subtotal);
    }

    if (!collapsed && !item.noChildAdd) {
      const addChildRow = document.createElement('div');
      addChildRow.className = 'add-child-row';
      const addChildBtn = document.createElement('button');
      addChildBtn.type = 'button';
      addChildBtn.className = 'add-row-btn';
      addChildBtn.textContent = '＋';
      addChildBtn.title = '小項目を追加';
      addChildBtn.addEventListener('click', () => {
        const name = prompt('新しい小項目名を入力してください');
        if (!name || !name.trim()) return;
        const trimmed = name.trim();
        const newChildId = uid();
        if (!Array.isArray(item.children)) item.children = [];
        item.children.push({ id: newChildId, name: trimmed, amount: null, payment: 'none', date: null, place: '' });

        const tmplItem = data.template.find(t => t.id === item.id);
        if (tmplItem) {
          if (!Array.isArray(tmplItem.children)) tmplItem.children = [];
          tmplItem.children.push({ id: newChildId, name: trimmed, defaultAmount: null });
        }
        saveData();
        renderSheet();
      });
      addChildRow.appendChild(addChildBtn);
      group.appendChild(addChildRow);
    }

    list.appendChild(group);
  });
}

function buildItemRow(row, depth, siblingArray, forceBlankName) {
  const el = document.createElement('div');
  const isGroupHeader = depth === 0 && Array.isArray(row.children);
  el.className = 'item-row' + (depth > 0 ? ' depth-1' : '') + (isGroupHeader ? ' group-header' : '');

  const nameEl = document.createElement('span');
  nameEl.className = 'item-name';
  const collapsed = isGroupHeader && !!data.collapsedGroups[row.name];
  nameEl.textContent = (isGroupHeader ? (collapsed ? '▸ ' : '▾ ') : '') + row.name;
  if (depth > 0 && forceBlankName) {
    // Auto-entry log rows never show a name — always collapse to a hard
    // zero width (regardless of any stray leftover text) so date/place/
    // amount start at the exact same spot on every row.
    nameEl.style.flex = '0 0 0';
    nameEl.style.width = '0';
    nameEl.style.overflow = 'hidden';
  }

  if (isGroupHeader) {
    nameEl.title = 'クリックで折りたたみ / ダブルクリックで名前を編集';
    nameEl.style.cursor = 'pointer';
    let clickTimer = null;
    nameEl.addEventListener('click', () => {
      if (clickTimer) return;
      clickTimer = setTimeout(() => {
        clickTimer = null;
        data.collapsedGroups[row.name] = !collapsed;
        saveData();
        renderSheet();
      }, 250);
    });
    nameEl.addEventListener('dblclick', () => {
      clearTimeout(clickTimer);
      clickTimer = null;
      startRenameRow(el, row, depth);
    });
  } else {
    nameEl.title = 'ダブルクリックで名前を編集';
    nameEl.addEventListener('dblclick', () => startRenameRow(el, row, depth));
  }
  el.appendChild(nameEl);

  const entryFields = document.createElement('div');
  entryFields.className = 'entry-fields';

  const dateEl = document.createElement('span');
  dateEl.className = 'item-date' + (row.date ? '' : ' empty');
  dateEl.textContent = row.date ? formatDateShort(row.date) : '–';

  const placeEl = document.createElement('span');
  placeEl.className = 'item-place' + (row.place ? '' : ' empty');
  placeEl.textContent = row.place || '–';

  const amountBtn = document.createElement('button');
  amountBtn.type = 'button';
  amountBtn.className = 'amount-chip ' + row.payment + (row.amount === null ? ' empty' : '');
  amountBtn.textContent = row.amount === null ? '–' : formatCurrency(row.amount);
  amountBtn.title = 'クリックで 未選択→現金→カード を切り替え';
  amountBtn.addEventListener('click', () => {
    const order = ['none', 'cash', 'card'];
    row.payment = order[(order.indexOf(row.payment) + 1) % order.length];
    saveData();
    renderSheet();
  });
  amountBtn.addEventListener('dblclick', () => startEditEntry(entryFields, row));

  entryFields.append(dateEl, placeEl, amountBtn);
  el.appendChild(entryFields);

  const editBtn = document.createElement('button');
  editBtn.type = 'button';
  editBtn.className = 'row-btn';
  editBtn.textContent = '✎';
  editBtn.style.color = '#bbb';
  editBtn.title = '日付・場所・金額を編集';
  editBtn.addEventListener('click', () => startEditEntry(entryFields, row));
  el.appendChild(editBtn);

  const doDelete = () => {
    if (!confirm(`「${row.name}」を削除しますか?`)) return;
    const idx = siblingArray.findIndex(r => r.id === row.id);
    if (idx >= 0) siblingArray.splice(idx, 1);
    if (depth === 0) {
      const ti = data.template.findIndex(t => t.id === row.id);
      if (ti >= 0) data.template.splice(ti, 1);
    } else {
      data.template.forEach(t => {
        if (Array.isArray(t.children)) {
          const ci = t.children.findIndex(c => c.id === row.id);
          if (ci >= 0) t.children.splice(ci, 1);
        }
      });
    }
    saveData();
    renderSheet();
    showToast('削除しました');
  };

  const reorderGroup = document.createElement('div');
  reorderGroup.className = 'reorder-group';
  const rowIdx = siblingArray.findIndex(r => r.id === row.id);

  const upBtn = document.createElement('button');
  upBtn.type = 'button';
  upBtn.className = 'reorder-btn';
  upBtn.textContent = '▲';
  upBtn.title = '上に移動';
  upBtn.disabled = rowIdx <= 0;
  upBtn.addEventListener('click', () => moveRow(row, depth, siblingArray, -1));

  const downBtn = document.createElement('button');
  downBtn.type = 'button';
  downBtn.className = 'reorder-btn';
  downBtn.textContent = '▼';
  downBtn.title = '下に移動';
  downBtn.disabled = rowIdx < 0 || rowIdx >= siblingArray.length - 1;
  downBtn.addEventListener('click', () => moveRow(row, depth, siblingArray, 1));

  reorderGroup.append(upBtn, downBtn);
  el.appendChild(reorderGroup);

  const wrap = document.createElement('div');
  wrap.className = 'item-row-wrap';

  const swipeDeleteBtn = document.createElement('button');
  swipeDeleteBtn.type = 'button';
  swipeDeleteBtn.className = 'swipe-delete-btn';
  swipeDeleteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
  swipeDeleteBtn.title = '削除';
  swipeDeleteBtn.addEventListener('click', doDelete);

  wrap.append(swipeDeleteBtn, el);
  attachSwipeToDelete(el);

  return wrap;
}

const SWIPE_REVEAL = 72;

function closeOpenSwipeRows(except) {
  document.querySelectorAll('.item-row.swipe-open').forEach(r => {
    if (r === except) return;
    r.style.transition = 'transform 0.2s ease';
    r.style.transform = 'translateX(0)';
    r.classList.remove('swipe-open');
  });
}

function attachSwipeToDelete(rowEl) {
  let startX = 0, startY = 0, baseX = 0, currentX = 0, axis = null, dragging = false, pointerId = null;

  rowEl.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    startX = e.clientX;
    startY = e.clientY;
    baseX = rowEl.classList.contains('swipe-open') ? -SWIPE_REVEAL : 0;
    currentX = baseX;
    axis = null;
    dragging = true;
    pointerId = e.pointerId;
    rowEl.style.transition = 'none';
  });

  rowEl.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (axis === null) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      // Only capture (and take over from whatever was under the pointer)
      // once we know this is actually a horizontal swipe, not a tap.
      if (axis === 'x') {
        rowEl.setPointerCapture(pointerId);
        closeOpenSwipeRows(rowEl);
      }
    }
    if (axis !== 'x') return;
    e.preventDefault();
    currentX = Math.min(0, Math.max(-SWIPE_REVEAL, baseX + dx));
    rowEl.style.transform = `translateX(${currentX}px)`;
  });

  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    rowEl.style.transition = 'transform 0.2s ease';
    if (axis === 'x' && currentX < -SWIPE_REVEAL / 2) {
      rowEl.style.transform = `translateX(-${SWIPE_REVEAL}px)`;
      rowEl.classList.add('swipe-open');
    } else {
      rowEl.style.transform = 'translateX(0)';
      rowEl.classList.remove('swipe-open');
    }
    axis = null;
  };
  rowEl.addEventListener('pointerup', endDrag);
  rowEl.addEventListener('pointercancel', endDrag);
}

function findTemplateSiblingArray(id, depth) {
  if (depth === 0) return data.template;
  for (const t of data.template) {
    if (Array.isArray(t.children) && t.children.some(c => c.id === id)) return t.children;
  }
  return null;
}

function moveRow(row, depth, siblingArray, direction) {
  const idx = siblingArray.findIndex(r => r.id === row.id);
  const newIdx = idx + direction;
  if (idx < 0 || newIdx < 0 || newIdx >= siblingArray.length) return;
  const [moved] = siblingArray.splice(idx, 1);
  siblingArray.splice(newIdx, 0, moved);

  const tmplArray = findTemplateSiblingArray(row.id, depth);
  if (tmplArray) {
    const tIdx = tmplArray.findIndex(t => t.id === row.id);
    const tNewIdx = tIdx + direction;
    if (tIdx >= 0 && tNewIdx >= 0 && tNewIdx < tmplArray.length) {
      const [tMoved] = tmplArray.splice(tIdx, 1);
      tmplArray.splice(tNewIdx, 0, tMoved);
    }
  }
  saveData();
  renderSheet();
}

function startRenameRow(rowEl, row, depth) {
  const nameEl = rowEl.querySelector('.item-name');
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'item-name-input';
  input.value = row.name;
  nameEl.replaceWith(input);
  input.focus();
  input.select();

  const commit = () => {
    const val = input.value.trim();
    if (val) {
      row.name = val;
      if (depth === 0) {
        const t = data.template.find(x => x.id === row.id);
        if (t) t.name = val;
      } else {
        data.template.forEach(t => {
          if (Array.isArray(t.children)) {
            const c = t.children.find(x => x.id === row.id);
            if (c) c.name = val;
          }
        });
      }
      saveData();
    }
    renderSheet();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); renderSheet(); }
  });
}

function startEditEntry(fieldsEl, row) {
  const form = document.createElement('div');
  form.className = 'edit-form';

  const dateInput = document.createElement('input');
  dateInput.type = 'text';
  dateInput.className = 'edit-date';
  dateInput.placeholder = '7/20';
  dateInput.value = row.date || '';

  const placeInput = document.createElement('input');
  placeInput.type = 'text';
  placeInput.className = 'edit-place';
  placeInput.placeholder = '@';
  placeInput.value = row.place || '';

  const amountInput = document.createElement('input');
  amountInput.type = 'number';
  amountInput.className = 'edit-amount';
  amountInput.step = '1';
  amountInput.placeholder = '¥';
  amountInput.value = row.amount === null ? '' : row.amount;

  const confirmBtn = document.createElement('button');
  confirmBtn.type = 'button';
  confirmBtn.className = 'edit-confirm';
  confirmBtn.textContent = '✓';

  form.append(dateInput, placeInput, amountInput, confirmBtn);
  fieldsEl.replaceWith(form);
  dateInput.focus();

  let committed = false;
  const commit = () => {
    if (committed) return;
    committed = true;
    const val = parseFloat(amountInput.value);
    row.amount = (amountInput.value.trim() === '' || isNaN(val)) ? null : val;
    row.date = dateInput.value || null;
    row.place = placeInput.value.trim();
    saveData();
    renderSheet();
  };
  const cancel = () => {
    if (committed) return;
    committed = true;
    renderSheet();
  };

  confirmBtn.addEventListener('click', commit);
  [dateInput, placeInput, amountInput].forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
  });
  form.addEventListener('focusout', () => {
    // relatedTarget isn't reliable on all mobile browsers, so re-check
    // after focus has settled instead of trusting it directly.
    setTimeout(() => {
      if (!form.contains(document.activeElement)) commit();
    }, 0);
  });

  // iOS Safari doesn't reliably blur a focused input when tapping a
  // non-interactive element (plain text, empty space, etc.), so focusout
  // alone can miss it. Track this form globally and commit on any tap
  // outside it, regardless of what was tapped.
  openEditForm = { form, commit };
}

let openEditForm = null;
document.addEventListener('pointerdown', (e) => {
  if (openEditForm && !openEditForm.form.contains(e.target)) {
    const { commit } = openEditForm;
    openEditForm = null;
    commit();
  }
});

/* ── RENDER: SUMMARY ── */
function renderSummary() {
  const cycle = ensureCycle(currentCycle);
  const cash = sumBy(cycle.items, r => r.payment === 'cash');
  const card = sumBy(cycle.items, r => r.payment === 'card');
  const grand = sumBy(cycle.items, () => true);
  // 残高は現金・カードで確定した支出のみを差し引く。未選択(黒)のままの
  // 金額はまだ請求が来ていない予定額として、残高には反映しない。
  const balance = (cycle.totalBudget || 0) - (cash + card);

  document.getElementById('sum-cash').textContent = formatCurrency(cash);
  document.getElementById('sum-card').textContent = formatCurrency(card);
  const balanceEl = document.getElementById('sum-balance');
  balanceEl.textContent = formatCurrency(balance);
  balanceEl.className = 'card-value balance ' + (balance >= 0 ? 'positive' : 'negative');

  document.getElementById('grand-total').textContent = formatCurrency(grand);
  document.getElementById('total-budget-input').value = cycle.totalBudget || '';
}

/* ── RENDER: SHEET (all) ── */
function renderSheet() {
  ensureCycle(currentCycle);
  document.getElementById('cycle-label').textContent = cycleLabel(currentCycle);
  renderCycleSelect();
  renderItemList();
  renderSummary();
}

/* ── SETTINGS ── */
function renderSettings() {
  document.getElementById('default-budget-input').value = data.totalBudgetDefault || '';
}

document.getElementById('default-budget-input').addEventListener('change', (e) => {
  const val = parseFloat(e.target.value);
  data.totalBudgetDefault = (val > 0) ? val : 0;
  saveData();
  showToast('保存しました');
});

document.getElementById('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  a.href = url;
  a.download = `kakeibo-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('書き出しました');
});

document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed.template) || typeof parsed.cycles !== 'object') throw new Error('invalid format');
      if (!confirm('現在のデータを読み込んだ内容で上書きします。よろしいですか?')) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      data = loadData();
      currentCycle = cycleKeyForDate(new Date());
      showToast('読み込みました');
      renderSheet();
      renderSettings();
    } catch (err) {
      showToast('ファイルの形式が正しくありません');
    } finally {
      e.target.value = '';
    }
  };
  reader.readAsText(file);
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('本当にすべてのデータを削除しますか?この操作は取り消せません。')) return;
  if (!confirm('もう一度確認します。全項目・記録・予算を削除してよろしいですか?')) return;
  data = defaultData();
  saveData();
  currentCycle = cycleKeyForDate(new Date());
  showToast('データを削除しました');
  renderSheet();
  renderSettings();
});

/* ── INIT ── */
renderSheet();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
