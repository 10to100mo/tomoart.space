<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Practice — TOMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100;0,200;0,300;1,100;1,200;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 300;
      background: #fff;
      color: #111;
      font-size: 14px;
      letter-spacing: 0.08em;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 44px 28px 100px;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 52px;
    }

    .back-link {
      font-size: 11px;
      letter-spacing: 0.25em;
      color: #aaa;
      transition: color 0.15s;
    }
    .back-link:hover { color: #111; }

    .app-title {
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 0.3em;
    }

    .level-badge {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #888;
      border: 1px solid #ddd;
      padding: 4px 12px;
    }

    /* ── PROGRESS ── */
    .progress-section { margin-bottom: 44px; }

    .progress-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: #bbb;
      margin-bottom: 12px;
    }

    .progress-dots { display: flex; gap: 8px; }

    .dot {
      width: 9px;
      height: 9px;
      border: 1px solid #ddd;
      transition: background 0.3s, border-color 0.3s;
    }
    .dot.filled { background: #111; border-color: #111; }
    .dot.partial { background: #ccc; border-color: #ccc; }

    /* ── QUESTION CARD ── */
    .question-card {
      border: 1px solid #e8e8e8;
      padding: 40px 36px;
      margin-bottom: 36px;
    }

    .question-label {
      font-size: 10px;
      letter-spacing: 0.35em;
      color: #ccc;
      margin-bottom: 22px;
    }

    .question-text {
      font-size: 30px;
      font-weight: 200;
      letter-spacing: 0.04em;
      line-height: 1.5;
    }

    /* ── INPUT ── */
    .input-section { margin-bottom: 28px; }

    .input-label {
      font-size: 10px;
      letter-spacing: 0.35em;
      color: #bbb;
      margin-bottom: 10px;
    }

    .answer-input {
      width: 100%;
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 300;
      font-size: 17px;
      letter-spacing: 0.06em;
      border: none;
      border-bottom: 1px solid #111;
      padding: 12px 0;
      background: transparent;
      color: #111;
      outline: none;
      resize: none;
      min-height: 54px;
      line-height: 1.6;
      transition: border-color 0.15s;
    }
    .answer-input::placeholder { color: #ccc; }
    .answer-input:disabled { opacity: 0.5; }

    .speak-my-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 14px;
      background: none;
      border: none;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #aaa;
      padding: 0;
      transition: color 0.15s;
    }
    .speak-my-btn:hover { color: #111; }
    .speak-my-btn svg { width: 15px; height: 15px; fill: currentColor; }
    .speak-my-btn.speaking { color: #111; }


    /* ── RESULT WORD ── */
    .result-word {
      display: none;
      font-size: 52px;
      font-weight: 100;
      letter-spacing: 0.18em;
      line-height: 1;
      margin-bottom: 14px;
    }
    .result-word.visible  { display: block; }
    .result-word.correct  { color: #1a6b3a; }
    .result-word.incorrect { color: #b52020; }

    .result-note {
      display: none;
      font-size: 13px;
      letter-spacing: 0.15em;
      color: #888;
      margin-bottom: 28px;
      line-height: 1.9;
    }
    .result-note.visible { display: block; }

    /* ── ANSWER REVEAL ── */
    .answer-reveal {
      display: none;
      padding: 22px 0 28px;
      border-top: 1px solid #ebebeb;
      margin-bottom: 4px;
    }
    .answer-reveal.visible { display: block; }

    .answer-reveal-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: #bbb;
      margin-bottom: 10px;
    }

    .answer-reveal-text {
      font-size: 22px;
      font-weight: 200;
      letter-spacing: 0.07em;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .speak-answer-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: none;
      border: none;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #aaa;
      padding: 0;
      transition: color 0.15s;
    }
    .speak-answer-btn:hover { color: #111; }
    .speak-answer-btn svg { width: 15px; height: 15px; fill: currentColor; }

    /* ── ACTIONS ── */
    .action-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn {
      flex: 1;
      background: none;
      border: 1px solid #ddd;
      padding: 15px 16px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.25em;
      color: #111;
      transition: border-color 0.15s, opacity 0.15s;
    }
    .btn:hover:not(:disabled) { border-color: #999; }
    .btn:disabled { opacity: 0.3; cursor: default; }

    .btn-primary {
      background: #111;
      border-color: #111;
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: #333; border-color: #333; }

    .retry-row { display: none; }

    /* ── TABS ── */
    .tab-bar {
      display: flex;
      gap: 0;
      margin-bottom: 44px;
      border-bottom: 1px solid #e8e8e8;
    }

    .tab {
      background: none;
      border: none;
      padding: 12px 0;
      margin-right: 32px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.28em;
      color: #aaa;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s;
    }
    .tab.active { color: #111; border-bottom-color: #111; }
    .tab:hover:not(.active) { color: #555; }

    /* ── MY CARDS ── */
    .mc-section { display: none; }
    .mc-section.active { display: block; }

    .mc-card-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid #f0f0f0;
      gap: 16px;
    }

    .mc-card-texts { flex: 1; }

    .mc-card-ja {
      font-size: 17px;
      font-weight: 200;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .mc-card-en {
      font-size: 13px;
      letter-spacing: 0.05em;
      color: #888;
    }

    .mc-delete-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: #ccc;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .mc-delete-btn:hover { color: #999; }

    .mc-empty {
      font-size: 13px;
      letter-spacing: 0.1em;
      color: #ccc;
      padding: 40px 0;
      text-align: center;
      line-height: 2.2;
    }

    .mc-form-label {
      font-size: 10px;
      letter-spacing: 0.35em;
      color: #bbb;
      margin-bottom: 10px;
    }

    .mc-textarea {
      width: 100%;
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 0.06em;
      border: none;
      border-bottom: 1px solid #111;
      padding: 10px 0;
      background: transparent;
      color: #111;
      outline: none;
      resize: none;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .mc-textarea::placeholder { color: #ccc; }

    .mc-btn-row {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }

    /* quiz in mycards uses same styles as practice */

    /* ── NEXT ── */
    .next-btn {
      display: none;
      width: 100%;
      background: #111;
      border: none;
      color: #fff;
      padding: 18px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.3em;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 16px;
    }
    .next-btn:hover { background: #333; }
    .next-btn.visible { display: block; }

    /* ── STATS ── */
    .stats-bar {
      display: flex;
      gap: 36px;
      margin-top: 52px;
      padding-top: 24px;
      border-top: 1px solid #f0f0f0;
    }

    .stat { display: flex; flex-direction: column; gap: 4px; }

    .stat-value {
      font-size: 24px;
      font-weight: 100;
      letter-spacing: 0.03em;
      line-height: 1;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.28em;
      color: #bbb;
    }

    /* ── OVERLAY SCREENS ── */
    .overlay {
      display: none;
      text-align: center;
      padding: 80px 0 40px;
    }
    .overlay.visible { display: block; }

    .overlay-title {
      font-size: 44px;
      font-weight: 100;
      letter-spacing: 0.12em;
      margin-bottom: 24px;
    }

    .overlay-sub {
      font-size: 13px;
      letter-spacing: 0.2em;
      color: #888;
      line-height: 2.4;
      margin-bottom: 60px;
    }

    .overlay-btn {
      background: #111;
      border: none;
      color: #fff;
      padding: 18px 60px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.3em;
      cursor: pointer;
      transition: background 0.15s;
    }
    .overlay-btn:hover { background: #333; }

    /* ── NO TTS WARNING ── */
    .no-tts-note {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #ccc;
      margin-top: 8px;
    }

    /* ── REVIEW BAR ── */
    .review-bar {
      display: none;
      margin-bottom: 32px;
    }

    .review-bar-btn {
      width: 100%;
      background: none;
      border: 1px solid #f0d080;
      padding: 14px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.25em;
      color: #8a6000;
      cursor: pointer;
      transition: background 0.15s;
    }
    .review-bar-btn:hover { background: #fffdf0; }

    .review-mode-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: #8a6000;
      margin-bottom: 12px;
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      .container { padding: 32px 20px 80px; }
      .question-text { font-size: 24px; }
      .question-card { padding: 30px 24px; }
      .overlay-title { font-size: 36px; }
      .action-row { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <a href="/" class="back-link">← TOMO</a>
    <span class="app-title">ENGLISH PRACTICE</span>
    <span class="level-badge" id="level-badge">LV 1</span>
  </div>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <button class="tab active" id="tab-practice" onclick="switchTab('practice')">練習問題</button>
    <button class="tab" id="tab-mycards" onclick="switchTab('mycards')">マイカード</button>
  </div>

  <!-- REVIEW BAR (shown when there are items to review) -->
  <div class="review-bar" id="review-bar">
    <button class="review-bar-btn" onclick="startReview()">
      復習する — <span id="review-count">0</span>問
    </button>
  </div>

  <!-- ══ PRACTICE TAB ══ -->
  <div id="practice-area">

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-label" id="progress-label">LEVEL <span id="progress-level-num">1</span> — <span id="progress-level-name">Basic Phrases</span></div>
      <div class="progress-dots" id="progress-dots"></div>
    </div>

    <!-- Question -->
    <div class="question-card">
      <div class="question-label">日本語 → 英語に訳してください</div>
      <div class="question-text" id="question-text">—</div>
    </div>

    <!-- Input -->
    <div class="input-section">
      <div class="input-label">YOUR ANSWER  /  あなたの答え</div>
      <textarea class="answer-input" id="answer-input" placeholder="Type your English answer..."
        rows="2" autocomplete="off" spellcheck="false"></textarea>
      <button class="speak-my-btn" onclick="speakMyAnswer()">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        READ MY ANSWER
      </button>
    </div>

    <div class="result-word" id="result-word"></div>
    <div class="result-note" id="result-note"></div>

    <div class="answer-reveal" id="answer-reveal">
      <div class="answer-reveal-label">正解</div>
      <div class="answer-reveal-text" id="answer-reveal-text"></div>
      <button class="speak-answer-btn" onclick="speakCorrectAnswer()">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        LISTEN TO ANSWER
      </button>
    </div>

    <div class="answer-reveal" id="show-answer-area" style="display:none">
      <div class="answer-reveal-label">正解</div>
      <div class="answer-reveal-text" id="show-answer-text"></div>
    </div>

    <div class="action-row" id="action-row">
      <button class="btn" id="show-answer-btn" onclick="doShowAnswer()">正解を見る</button>
      <button class="btn btn-primary" id="check-btn" onclick="doCheck()">CHECK ANSWER</button>
    </div>

    <button class="next-btn" id="next-btn" onclick="doNext()">NEXT QUESTION →</button>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="stat-level">1</span>
        <span class="stat-label">LEVEL</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-correct">0</span>
        <span class="stat-label">CORRECT</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-streak">0</span>
        <span class="stat-label">STREAK</span>
      </div>
    </div>

  </div><!-- /practice-area -->

  <!-- LEVEL UP / COMPLETE overlays -->
  <div class="overlay" id="levelup-screen">
    <div class="overlay-title">LEVEL UP!</div>
    <div class="overlay-sub" id="levelup-sub"></div>
    <button class="overlay-btn" onclick="beginLevel()">CONTINUE →</button>
  </div>
  <div class="overlay" id="complete-screen">
    <div class="overlay-title">COMPLETE!</div>
    <div class="overlay-sub">All 5 levels cleared!<br>Excellent work.<br><br>おめでとうございます！</div>
    <button class="overlay-btn" onclick="doRestart()">RESTART →</button>
  </div>

  <!-- ══ MY CARDS TAB ══ -->
  <div id="mycards-area" style="display:none">

    <!-- LIST VIEW -->
    <div id="mc-list-view">
      <div id="mc-empty" class="mc-empty" style="display:none">
        カードがまだありません。<br>
        下のボタンから追加してください。
      </div>
      <div id="mc-card-list"></div>

      <div class="mc-btn-row" style="margin-top:32px">
        <button class="btn" onclick="mcShowAdd()">+ カードを追加</button>
        <button class="btn btn-primary" id="mc-quiz-start-btn" onclick="mcStartQuiz()">練習する →</button>
      </div>
    </div>

    <!-- ADD FORM VIEW -->
    <div id="mc-add-view" style="display:none">
      <div style="margin-bottom:32px">
        <div class="mc-form-label">日本語の文章</div>
        <textarea class="mc-textarea" id="mc-ja-input" placeholder="例：今日はいい天気ですね。" rows="2"></textarea>
        <div class="mc-form-label">英語の正解</div>
        <textarea class="mc-textarea" id="mc-en-input" placeholder="例：It's a nice day today." rows="2"></textarea>
      </div>
      <div class="mc-btn-row">
        <button class="btn" onclick="mcCancelAdd()">キャンセル</button>
        <button class="btn btn-primary" onclick="mcSaveCard()">保存する</button>
      </div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="mc-quiz-view" style="display:none">
      <div class="question-card">
        <div class="question-label">日本語 → 英語に訳してください</div>
        <div class="question-text" id="mc-question-text">—</div>
      </div>

      <div class="input-section">
        <div class="input-label">YOUR ANSWER  /  あなたの答え</div>
        <textarea class="answer-input" id="mc-answer-input" placeholder="Type your English answer..."
          rows="2" autocomplete="off" spellcheck="false"></textarea>
        <button class="speak-my-btn" onclick="mcSpeakMyAnswer()">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          READ MY ANSWER
        </button>
      </div>

      <div class="result-word" id="mc-result-word"></div>
      <div class="result-note" id="mc-result-note"></div>

      <div class="answer-reveal" id="mc-answer-reveal">
        <div class="answer-reveal-label">正解</div>
        <div class="answer-reveal-text" id="mc-answer-reveal-text"></div>
        <button class="speak-answer-btn" onclick="mcSpeakCorrect()">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          LISTEN TO ANSWER
        </button>
      </div>

      <div class="answer-reveal" id="mc-show-answer-area" style="display:none">
        <div class="answer-reveal-label">正解</div>
        <div class="answer-reveal-text" id="mc-show-answer-text"></div>
      </div>

      <div class="action-row" id="mc-action-row">
        <button class="btn" id="mc-show-answer-btn" onclick="mcDoShowAnswer()">正解を見る</button>
        <button class="btn btn-primary" id="mc-check-btn" onclick="mcDoCheck()">CHECK ANSWER</button>
      </div>

      <button class="next-btn" id="mc-next-btn" onclick="mcDoNext()">NEXT →</button>

      <div style="margin-top:32px; padding-top:24px; border-top:1px solid #f0f0f0;">
        <button class="btn" onclick="mcBackToList()">← カード一覧に戻る</button>
      </div>
    </div>

  </div><!-- /mycards-area -->

</div><!-- /container -->

<script>
// ── QUESTIONS ────────────────────────────────────────────────────────────────

const QUESTIONS = [
  // LEVEL 1: Basic greetings & everyday phrases
  { ja: "おはようございます。", en: ["Good morning."], level: 1 },
  { ja: "こんにちは。", en: ["Hello.", "Hi.", "Good afternoon."], level: 1 },
  { ja: "こんばんは。", en: ["Good evening."], level: 1 },
  { ja: "おやすみなさい。", en: ["Good night."], level: 1 },
  { ja: "ありがとうございます。", en: ["Thank you.", "Thanks."], level: 1 },
  { ja: "どういたしまして。", en: ["You're welcome.", "Not at all.", "Don't mention it.", "My pleasure."], level: 1 },
  { ja: "すみません。", en: ["Excuse me.", "Sorry.", "I'm sorry."], level: 1 },
  { ja: "はじめまして。", en: ["Nice to meet you.", "Pleased to meet you."], level: 1 },
  { ja: "お元気ですか？", en: ["How are you?", "How are you doing?"], level: 1 },
  { ja: "元気です、ありがとう。", en: ["I'm fine, thank you.", "I'm good, thank you.", "I'm doing well, thank you."], level: 1 },
  { ja: "さようなら。", en: ["Goodbye.", "Bye.", "See you."], level: 1 },
  { ja: "また明日。", en: ["See you tomorrow."], level: 1 },
  { ja: "わかりました。", en: ["I understand.", "Got it.", "I see.", "Understood."], level: 1 },
  { ja: "お名前は何ですか？", en: ["What is your name?", "What's your name?"], level: 1 },
  { ja: "（初対面で）よろしくお願いします。", en: ["Nice to meet you.", "Pleased to meet you.", "It's nice to meet you."], level: 1 },
  { ja: "（一緒に仕事をすることになって）よろしくお願いします。", en: ["I look forward to working with you.", "I'm looking forward to working with you."], level: 1 },
  { ja: "（お願いをして）よろしくお願いします。", en: ["Thank you in advance.", "I'm counting on you.", "I appreciate your help."], level: 1 },

// ── HELPERS ──────────────────────────────────────────────────────────────────

function $(id) { return document.getElementById(id); }
function showEl(id) { const el = $(id); if (el) el.style.display = ""; }
function hideEl(id) { const el = $(id); if (el) el.style.display = "none"; }

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = [];
  for (let i = 0; i <= m; i++) {
    dp[i] = [i];
    for (let j = 1; j <= n; j++) dp[i][j] = i === 0 ? j : 0;
  }
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

function norm(s) {
  return s.toLowerCase().trim().replace(/[.!?,]+$/, "").replace(/\s+/g, " ")
          .replace(/’/g, "'").replace(/‘/g, "'");
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function bestMatchFromList(input, answers) {
  const normInput = norm(input);
  let minDist = Infinity, best = answers[0], exact = false;
  for (const ans of answers) {
    const normAns = norm(ans);
    if (normInput === normAns) { exact = true; best = ans; break; }
    const d = levenshtein(normInput, normAns);
    if (d < minDist) { minDist = d; best = ans; }
  }
  return { exact, dist: minDist, ans: best };
}

const hasTTS = "speechSynthesis" in window;

function speak(text) {
  if (!hasTTS) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.88;
  speechSynthesis.speak(u);
}

function speakMyAnswer()    { const v = $("answer-input").value.trim(); if (v) speak(v); }

}

// ── WRONG LIST (復習) ─────────────────────────────────────────────────────────

let wrongList = JSON.parse(localStorage.getItem("ep_wrong") || "[]");

function saveWrong() { localStorage.setItem("ep_wrong", JSON.stringify(wrongList)); }

function addToWrong(q) {
  if (!wrongList.find(w => w.ja === q.ja)) {
    wrongList.push({ ja: q.ja, en: Array.isArray(q.en) ? q.en : [q.en] });
    saveWrong(); updateReviewBar();
  }
}

function removeFromWrong(q) {
  const before = wrongList.length;
  wrongList = wrongList.filter(w => w.ja !== q.ja);
  if (wrongList.length !== before) { saveWrong(); updateReviewBar(); }
}

function updateReviewBar() {
  if (wrongList.length > 0) {
    $("review-bar").style.display = "block";
    $("review-count").textContent = wrongList.length;
  } else {
    $("review-bar").style.display = "none";
  }
}

function startReview() {
  S.reviewMode = true;
  S.queue = shuffle(wrongList.map(w => ({ ja: w.ja, en: w.en })));
  S.qIdx = 0;
  S.lvProgress = 0;

  // Show practice area
  $("mycards-area").style.display = "none";
  $("levelup-screen").style.display = "none";
  $("complete-screen").style.display = "none";
  $("practice-area").style.display = "";
  $("tab-practice").classList.add("active");
  $("tab-mycards").classList.remove("active");

  loadQ();
}

function exitReview() {
  S.reviewMode = false;
  beginLevel();
}

// ── TAB SWITCHING ─────────────────────────────────────────────────────────────

function switchTab(tab) {
  if (tab === "practice") {
    $("tab-practice").classList.add("active");
    $("tab-mycards").classList.remove("active");
    $("practice-area").style.display = "";
    $("levelup-screen").style.display = "none";
    $("complete-screen").style.display = "none";
    $("mycards-area").style.display = "none";
  } else {
    $("tab-mycards").classList.add("active");
    $("tab-practice").classList.remove("active");
    $("practice-area").style.display = "none";
    $("levelup-screen").style.display = "none";
    $("complete-screen").style.display = "none";
    $("mycards-area").style.display = "";
    mcShowList();
  }
}

// ══ PRACTICE ══════════════════════════════════════════════════════════════════

const S = {
  level:        parseInt(localStorage.getItem("ep_lv") || "1"),
  totalCorrect: parseInt(localStorage.getItem("ep_ok") || "0"),
  streak:       0,
  lvProgress:   0,
  answerShown:  false,
  phase:        "input",
  reviewMode:   false,
  queue:        [],
  qIdx:         0,
  currentQ:     null,
};

if (S.level > MAX_LEVEL) { S.level = 1; localStorage.setItem("ep_lv", "1"); }

function init() { updateReviewBar(); beginLevel(); }

function beginLevel() {
  hideEl("levelup-screen");
  hideEl("complete-screen");
  $("practice-area").style.display = "";

  S.lvProgress = 0;
  S.streak = 0;
  S.queue  = shuffle(QUESTIONS.filter(q => q.level === S.level));
  S.qIdx   = 0;

  updateHeader();
  loadQ();
}

function loadQ() {
  if (S.qIdx >= S.queue.length) {
    S.queue = shuffle(QUESTIONS.filter(q => q.level === S.level));
    S.qIdx  = 0;
  }
  S.currentQ    = S.queue[S.qIdx];
  S.answerShown = false;
  S.phase       = "input";

  $("question-text").textContent = S.currentQ.ja;
  $("answer-input").value = "";
  $("answer-input").disabled = false;

  $("result-word").className = "result-word";
  $("result-note").className = "result-note";
  $("answer-reveal").className = "answer-reveal";
  $("show-answer-area").style.display = "none";
  $("next-btn").style.display = "none";
  $("action-row").style.display = "";
  $("show-answer-btn").disabled = false;
  $("check-btn").disabled = false;

  if (S.reviewMode) {
    const remaining = wrongList.length;
    $("progress-label").innerHTML =
      `<span style="color:#8a6000;letter-spacing:0.3em">復習モード — あと ${remaining}問</span>`;
    $("progress-dots").innerHTML = "";
  } else {
    updateProgressDots();
    updateHeader();
  }

  updateStats();
  if (window.matchMedia("(pointer:fine)").matches) $("answer-input").focus();
}

function doShowAnswer() {
  S.answerShown = true;
  $("show-answer-btn").disabled = true;
  $("show-answer-text").textContent = S.currentQ.en[0];
  $("show-answer-area").style.display = "block";
  $("answer-input").focus();
  if (!S.reviewMode) addToWrong(S.currentQ);
}

function doCheck() {
  const input = $("answer-input").value.trim();
  if (!input) return;

  const { exact, dist, ans } = bestMatchFromList(input, S.currentQ.en);
  const threshold = Math.max(2, Math.floor(norm(ans).length * 0.18));

  if (exact) {
    if (!S.answerShown) {
      if (!S.reviewMode) { S.lvProgress++; }
      S.totalCorrect++; S.streak++;
      localStorage.setItem("ep_ok", S.totalCorrect);
      removeFromWrong(S.currentQ);
    }
    $("result-word").textContent = "CORRECT";
    $("result-word").className = "result-word visible correct";
    $("result-note").textContent = "正解！よくできました。";
    $("result-note").className = "result-note visible";
    $("answer-reveal-text").textContent = ans;
    $("answer-reveal").className = "answer-reveal visible";
    $("show-answer-area").style.display = "none";
    $("action-row").style.display = "none";
    $("answer-input").disabled = true;
    const btn = $("next-btn");
    btn.style.display = "block";
    if (S.reviewMode) {
      btn.textContent = "NEXT →";
      btn.onclick = doNext;
    } else {
      btn.textContent = S.lvProgress >= NEED_CORRECT ? "LEVEL COMPLETE →" : "NEXT QUESTION →";
      btn.onclick     = S.lvProgress >= NEED_CORRECT ? doLevelComplete : doNext;
    }
    updateStats(); updateProgressDots();
  } else if (dist <= threshold) {
    S.streak = 0;
    $("result-word").textContent = "INCORRECT";
    $("result-word").className = "result-word visible incorrect";
    $("result-note").textContent = "惜しい！小さなミスがあります。";
    $("result-note").className = "result-note visible";
    $("answer-input").disabled = false;
    $("check-btn").disabled = false;
    $("show-answer-btn").disabled = S.answerShown;
  } else {
    S.streak = 0;
    $("result-word").textContent = "INCORRECT";
    $("result-word").className = "result-word visible incorrect";
    $("result-note").className = "result-note";
    $("answer-input").disabled = false;
    $("check-btn").disabled = false;
    $("show-answer-btn").disabled = S.answerShown;
  }
}

function doNext() {
  S.qIdx++;
  if (S.reviewMode && S.qIdx >= S.queue.length) {
    // Review queue exhausted
    S.reviewMode = false;
    if (wrongList.length === 0) {
      // All cleared!
      $("practice-area").style.display = "none";
      $("levelup-sub").innerHTML = "復習完了！<br>すべて正解しました。<br><br>おめでとうございます！";
      $("levelup-screen").style.display = "block";
      // Override the continue button to go back to normal practice
      $("levelup-screen").querySelector(".overlay-btn").onclick = () => {
        $("levelup-screen").style.display = "none";
        beginLevel();
      };
    } else {
      // Some still remain
      $("practice-area").style.display = "none";
      $("levelup-sub").innerHTML =
        `一周しました！<br>まだ <strong style="font-size:20px;font-weight:200">${wrongList.length}</strong> 問残っています。`;
      $("levelup-screen").style.display = "block";
      $("levelup-screen").querySelector(".overlay-btn").textContent = "もう一度復習する →";
      $("levelup-screen").querySelector(".overlay-btn").onclick = startReview;
    }
    return;
  }
  loadQ();
}

function doLevelComplete() {
  if (S.level >= MAX_LEVEL) {
    $("practice-area").style.display = "none";
    $("complete-screen").style.display = "block";
    return;
  }
  S.level++;
  localStorage.setItem("ep_lv", S.level);
  $("practice-area").style.display = "none";
  $("levelup-sub").innerHTML =
    `Level ${S.level - 1} complete!<br>Advancing to Level ${S.level}:<br><br>` +
    `<span style="font-size:12px;letter-spacing:0.3em">${LEVEL_NAMES[S.level]}</span>`;
  $("levelup-screen").style.display = "block";
  updateHeader();
}

function doRestart() {
  S.level = 1; S.totalCorrect = 0; S.streak = 0; S.lvProgress = 0;
  localStorage.setItem("ep_lv", "1"); localStorage.setItem("ep_ok", "0");
  $("complete-screen").style.display = "none";
  beginLevel();
}

function updateHeader() {
  $("level-badge").textContent = "LV " + S.level;
  $("stat-level").textContent  = S.level;
  $("progress-level-num").textContent  = S.level;
  $("progress-level-name").textContent = LEVEL_NAMES[S.level] || "";
}

function updateProgressDots() {
  const c = $("progress-dots");
  c.innerHTML = "";
  for (let i = 0; i < NEED_CORRECT; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < S.lvProgress ? " filled" : "");
    c.appendChild(d);
  }
}

function updateStats() {
  $("stat-correct").textContent = S.totalCorrect;
  $("stat-streak").textContent  = S.streak;
}

$("answer-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doCheck(); }
});

  const list = $("mc-card-list");

    $("mc-quiz-start-btn").disabled = true;

// ── Quiz view ─────────────────────────────────────────────────────────────────

const MC = { queue: [], qIdx: 0, currentCard: null, answerShown: false };

function mcStartQuiz() {
  if (myCards.length === 0) return;
  MC.queue = shuffle([...myCards]);
  MC.qIdx  = 0;
  $("mc-list-view").style.display = "none";
  $("mc-add-view").style.display  = "none";
  $("mc-quiz-view").style.display = "";
  mcLoadQ();
}

function mcLoadQ() {
  if (MC.qIdx >= MC.queue.length) {
    MC.queue = shuffle([...myCards]);
    MC.qIdx  = 0;
  }
  MC.currentCard  = MC.queue[MC.qIdx];
  MC.answerShown  = false;

  $("mc-question-text").textContent = MC.currentCard.ja;
  $("mc-answer-input").value = "";
  $("mc-answer-input").disabled = false;

  $("mc-result-word").className = "result-word";
  $("mc-result-note").className = "result-note";
  $("mc-answer-reveal").className = "answer-reveal";
  $("mc-show-answer-area").style.display = "none";
  $("mc-next-btn").style.display = "none";
  $("mc-action-row").style.display = "";
  $("mc-show-answer-btn").disabled = false;
  $("mc-check-btn").disabled = false;

  if (window.matchMedia("(pointer:fine)").matches) $("mc-answer-input").focus();
}

function mcDoShowAnswer() {
  MC.answerShown = true;
  $("mc-show-answer-btn").disabled = true;
  $("mc-show-answer-text").textContent = MC.currentCard.en;
  $("mc-show-answer-area").style.display = "block";
  $("mc-answer-input").focus();
  addToWrong({ ja: MC.currentCard.ja, en: [MC.currentCard.en] });
}

function mcDoCheck() {
  const input = $("mc-answer-input").value.trim();
  if (!input) return;

  const { exact, dist, ans } = bestMatchFromList(input, [MC.currentCard.en]);
  const threshold = Math.max(2, Math.floor(norm(ans).length * 0.18));

  if (exact) {
    if (!MC.answerShown) removeFromWrong({ ja: MC.currentCard.ja });
    $("mc-result-word").textContent = "CORRECT";
    $("mc-result-word").className = "result-word visible correct";
    $("mc-result-note").textContent = "正解！よくできました。";
    $("mc-result-note").className = "result-note visible";
    $("mc-answer-reveal-text").textContent = ans;
    $("mc-answer-reveal").className = "answer-reveal visible";
    $("mc-show-answer-area").style.display = "none";
    $("mc-action-row").style.display = "none";
    $("mc-answer-input").disabled = true;
    $("mc-next-btn").style.display = "block";
  } else if (dist <= threshold) {
    $("mc-result-word").textContent = "INCORRECT";
    $("mc-result-word").className = "result-word visible incorrect";
    $("mc-result-note").textContent = "惜しい！小さなミスがあります。";
    $("mc-result-note").className = "result-note visible";
    $("mc-show-answer-btn").disabled = MC.answerShown;
  } else {
    $("mc-result-word").textContent = "INCORRECT";
    $("mc-result-word").className = "result-word visible incorrect";
    $("mc-result-note").className = "result-note";
    $("mc-show-answer-btn").disabled = MC.answerShown;
  }
}

function mcDoNext() { MC.qIdx++; mcLoadQ(); }

function mcBackToList() { mcShowList(); }

function mcSpeakMyAnswer() { const v = $("mc-answer-input").value.trim(); if (v) speak(v); }
function mcSpeakCorrect()  { if (MC.currentCard) speak(MC.currentCard.en); }

$("mc-answer-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); mcDoCheck(); }
});

$("mc-en-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); mcSaveCard(); }
});

// ── START ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
